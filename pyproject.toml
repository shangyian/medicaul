[project]
name = "medicaul"
version = "0.1.0"
description = "Neutral data tool for Medicare supplement (Medigap) rate comparison"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "playwright>=1.47",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "duckdb>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
package = false
