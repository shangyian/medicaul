[project]
name = "medicaul"
version = "0.1.0"
description = "Neutral data tool for Medicare supplement (Medigap) rate comparison"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "playwright>=1.47",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "duckdb>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["site/dist", "out", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear (likely bugs)
    "UP",   # pyupgrade (modernize syntax)
    "C4",   # comprehensions
    "SIM",  # simplifications
    "RUF",  # ruff-native rules
]
ignore = [
    "E501",    # line-too-long — formatter handles long lines; rule is too noisy on URLs/docstrings
    "SIM108",  # ternary if/else — sometimes if/else is clearer
    "B008",    # function call in default arg — common, intentional pattern
    "RUF001",  # ambiguous unicode in strings — em-dashes / × signs are deliberate in user-facing copy
    "RUF002",  # same, in docstrings
    "RUF003",  # same, in comments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]  # "useless expression" — pytest's parametrize bodies trip this

